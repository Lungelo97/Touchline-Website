<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You | Touchline Truth</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { gold: '#D4AF37', dark: '#0a0a0a' }, fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Montserrat', 'sans-serif'] } } }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@700;900&display=swap');
    body { background-color: #050505; color: #fff; }
  </style>
</head>
<body class="font-sans antialiased min-h-screen flex flex-col items-center justify-center p-4">
  <div class="bg-dark border border-gold/30 rounded-2xl p-10 max-w-lg w-full text-center shadow-2xl shadow-gold/10">
    <div class="w-20 h-20 bg-green-500/10 text-green-500 rounded-full flex items-center justify-center mx-auto mb-6">
      <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
    </div>
    <h1 class="font-display text-3xl font-black text-white mb-4 uppercase">Payment Successful</h1>
    <p id="message" class="text-gray-400 text-lg mb-8 leading-relaxed">
      Awe! Your payment for order <strong id="orderIdSpan" class="text-gold"></strong> was successful. Touchline's team is packing your gear.
    </p>
    <a href="/" class="inline-block px-8 py-4 bg-gold text-dark font-bold rounded-full hover:bg-yellow-500 transition shadow-[0_0_20px_rgba(212,175,55,0.2)]">Back to Store</a>
  </div>
  
  <script>
    const params = new URLSearchParams(window.location.search);
    const orderId = params.get('orderId') || 'UNKNOWN';
    document.getElementById('orderIdSpan').textContent = '#' + orderId;
  </script>
</body>
